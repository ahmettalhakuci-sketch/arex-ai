<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AREX Canlı</title>
<style>
:root{--acc:#7c5cff;--acc2:#22d3ee;--bg:#04060f;--txt:#f4f6ff;--mut:#a3abcf;--glass:rgba(255,255,255,.07);--brd:rgba(255,255,255,.13);--red:#ff4d6d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans Bengali","Noto Sans Arabic",sans-serif;overflow:hidden}
body.goz{filter:sepia(.35) saturate(.85) brightness(.9) hue-rotate(-12deg)}
#app{position:relative;height:100%;min-height:560px;display:flex;flex-direction:column;isolation:isolate}
/* aurora arka plan */
.aurora{position:absolute;inset:-10%;z-index:-1;filter:blur(28px);opacity:.38;
 background:radial-gradient(40% 35% at 30% 30%,color-mix(in srgb,var(--acc) 70%,transparent),transparent 70%),
            radial-gradient(35% 40% at 70% 65%,color-mix(in srgb,var(--acc2) 55%,transparent),transparent 70%),
            radial-gradient(30% 30% at 50% 90%,color-mix(in srgb,var(--acc) 35%,transparent),transparent 70%);
 animation:akis 18s ease-in-out infinite alternate}
@keyframes akis{0%{transform:translate(-4%,-2%) rotate(0)}100%{transform:translate(4%,3%) rotate(18deg)}}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 4px;z-index:2}
.marka{font-weight:700;letter-spacing:.4px;font-size:15px;opacity:.95}
.marka b{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.marka{white-space:nowrap}
/* Telefon (dar ekran): üst çubuk tek satır — "AREX Live" bölünmesin, Göz koruma yalnız simge */
@media (max-width:480px){
  .marka{font-size:14px}
  #gozBtn{font-size:0;padding:8px 10px}
  #gozBtn::before{content:"👁️";font-size:16px}
}
.ust-dugmeler{display:flex;gap:8px}
.mini{border:1px solid var(--brd);background:var(--glass);color:var(--txt);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;backdrop-filter:blur(14px)}
.mini.on{background:color-mix(in srgb,var(--acc) 35%,transparent);border-color:var(--acc)}
#sahne{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;overflow:hidden}
#video{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);object-fit:cover;border-radius:28px;display:none;border:1px solid var(--brd);box-shadow:0 30px 80px rgba(0,0,0,.5)}
#video.on{display:block}#video.ayna{transform:scaleX(-1)}
/* akışkan küre */
.kure{position:relative;width:210px;height:210px;transition:transform .12s ease-out}
.kure{border-radius:50%;box-shadow:0 0 60px color-mix(in srgb,var(--acc) 55%,transparent),0 0 120px color-mix(in srgb,var(--acc2) 25%,transparent);
 background:radial-gradient(circle at 32% 28%,#ffffff 0,color-mix(in srgb,var(--acc2) 70%,#fff) 14%,var(--acc) 48%,color-mix(in srgb,var(--acc) 55%,#0b0a2e) 78%,#0b0a2e 100%);overflow:hidden}
.kure .k{position:absolute;inset:0;border-radius:50%;mix-blend-mode:screen;filter:blur(4px);opacity:.55}
.kure .k1{background:radial-gradient(circle at 35% 35%,#fff 0,var(--acc) 35%,transparent 70%);animation:don 9s linear infinite}
.kure .k2{background:radial-gradient(circle at 65% 60%,var(--acc2) 0,transparent 65%);animation:don 13s linear infinite reverse}
.kure .k3{background:radial-gradient(circle at 50% 80%,color-mix(in srgb,var(--acc) 60%,#ff7ad9) 0,transparent 60%);animation:don 17s linear infinite}
.kure .cekirdek{position:absolute;inset:10% 18% 50% 22%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.75),rgba(255,255,255,0) 70%)}
@keyframes don{to{transform:rotate(360deg)}}
.kure.dinliyor .k{animation-duration:6s}
.kure.dusunuyor{animation:nefes 1.4s ease-in-out infinite}
@keyframes nefes{50%{transform:scale(.9);opacity:.75}}
.kure.konusuyor{box-shadow:0 0 80px color-mix(in srgb,var(--acc2) 70%,transparent),0 0 150px color-mix(in srgb,var(--acc) 35%,transparent)}
.kure.konusuyor .k1{background:radial-gradient(circle at 35% 35%,#fff 0,var(--acc2) 35%,transparent 70%)}
#video.on ~ .kure{position:absolute;bottom:20px;right:20px;width:84px;height:84px}
#video.on ~ .durumYazi{position:absolute;bottom:112px;right:20px;font-size:13px}
.durumYazi{font-size:18px;font-weight:500;letter-spacing:.3px;color:var(--txt);opacity:.92;min-height:24px;text-align:center}
.durumYazi small{display:block;font-size:12px;color:var(--mut);font-weight:400;margin-top:4px}
#altyazi{position:absolute;left:0;right:0;bottom:8px;padding:0 22px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.satir{max-width:720px;text-align:center;font-size:17px;line-height:1.5;color:var(--txt);text-shadow:0 2px 12px rgba(0,0,0,.6);opacity:.95;transition:opacity .4s}
.satir.ben{color:var(--mut);font-size:15px}
footer{padding:8px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;z-index:2}
.bar{display:flex;align-items:center;gap:12px;background:rgba(10,12,28,.55);border:1px solid var(--brd);border-radius:999px;padding:8px 10px;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.btn{width:52px;height:52px;border-radius:50%;border:0;background:var(--glass);color:var(--txt);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s,background .2s}
.btn:active{transform:scale(.9)}.btn.on{background:color-mix(in srgb,var(--acc2) 30%,transparent)}
.btn.ana{width:70px;height:70px;font-size:26px;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 10px 30px color-mix(in srgb,var(--acc) 50%,transparent)}
.btn.ana.aktif{background:var(--red);box-shadow:0 10px 30px rgba(255,77,109,.45)}
.yazibar{display:none;width:min(720px,100%);gap:8px}
.yazibar.on{display:flex}
.yazibar input{flex:1;background:var(--glass);border:1px solid var(--brd);color:var(--txt);border-radius:999px;padding:12px 18px;font-size:15px;outline:none;backdrop-filter:blur(14px)}
.yazibar button{border:0;border-radius:999px;padding:0 18px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:16px}
.canli-rozet{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;letter-spacing:.8px;
 background:var(--glass);border:1px solid var(--brd);backdrop-filter:blur(14px);color:var(--mut);transition:all .3s}
.canli-rozet .nokta{width:8px;height:8px;border-radius:50%;background:#59607f}
.canli-rozet.on{color:#fff;background:rgba(255,59,92,.18);border-color:rgba(255,77,109,.55);box-shadow:0 0 24px rgba(255,59,92,.25)}
.canli-rozet.on .nokta{background:#ff3b5c;box-shadow:0 0 0 0 rgba(255,59,92,.7);animation:nabiz 1.4s infinite}
.canli-rozet.bag .nokta{background:#ffc145;animation:nabiz 1s infinite}
@keyframes nabiz{0%{box-shadow:0 0 0 0 rgba(255,59,92,.7)}70%{box-shadow:0 0 0 9px rgba(255,59,92,0)}100%{box-shadow:0 0 0 0 rgba(255,59,92,0)}}
.sure{font-variant-numeric:tabular-nums;font-weight:600;opacity:.85}
.karakterler{display:flex;gap:8px;overflow-x:auto;max-width:min(760px,100%);padding:2px 4px;scrollbar-width:none}
.karakterler::-webkit-scrollbar{display:none}
.kar{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--brd);background:var(--glass);color:var(--txt);border-radius:999px;
 padding:8px 13px;font-size:13.5px;cursor:pointer;backdrop-filter:blur(14px);transition:all .2s}
.kar.on{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 55%,transparent),color-mix(in srgb,var(--acc2) 45%,transparent));border-color:transparent;font-weight:700}
.kar.mizah.on{background:linear-gradient(135deg,#ff9f1c,#ff4d6d)}
.persona-alt{font-size:12px;color:var(--mut);text-align:center;margin-top:-6px}
.hata{color:#ffb4c1;font-size:13px;text-align:center;min-height:16px;max-width:90%}
/* ayar çekmecesi */
#cekmece{position:absolute;left:0;right:0;bottom:0;z-index:5;background:rgba(12,14,32,.92);backdrop-filter:blur(24px);border-top:1px solid var(--brd);border-radius:26px 26px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s ease}
#cekmece.on{transform:none}
#cekmece h4{margin:4px 0 10px;font-size:15px}
.secim{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.secim label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:5px}
.secim select{background:var(--glass);color:var(--txt);border:1px solid var(--brd);border-radius:12px;padding:10px;font-size:14px}
.secim select option{background:#0b1030}
#notlar{max-height:150px;overflow:auto;font-size:13px;color:var(--mut);margin-top:12px;line-height:1.5}
</style>
<script>/* Masaüstü (Electron): sistem emoji fontu kum havuzunda çizilemiyor → açık kaynak Noto Color Emoji web fontu */(function(){try{if(!/Electron/.test(navigator.userAgent))return;fetch("https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap").then(function(r){return r.text()}).then(function(css){var s=document.createElement("style");s.textContent=css+css.replace(/font-family: 'Noto Color Emoji'/g,"font-family: 'Segoe UI'");document.head.appendChild(s)}).catch(function(){})}catch(e){}})();</script>
</head>
<body>
<div id="app">
  <div class="aurora"></div>
  <header>
    <div class="marka">⚡ AREX <b>Live</b></div>
    <div class="canli-rozet" id="rozet"><span class="nokta"></span><span id="rozetYazi">HAZIR</span><span class="sure" id="sure"></span></div>
    <div class="ust-dugmeler">
      <button class="mini" id="gozBtn" title="Göz koruma">👁️ Göz koruma</button>
      <button class="mini" id="ayarBtn" title="Ayarlar">⚙️</button>
    </div>
  </header>
  <div id="sahne">
    <video id="video" playsinline muted autoplay></video>
    <div class="kure" id="kure"><div class="k k1"></div><div class="k k2"></div><div class="k k3"></div><div class="cekirdek"></div></div>
    <div class="durumYazi" id="durum">Konuşmak için dokun<small id="altDurum">Sözünü kesebilir, kamerayı açıp gösterebilirsin</small></div>
    <div id="altyazi"></div>
  </div>
  <footer>
    <div class="karakterler" id="karakterler"></div>
    <div class="persona-alt" id="personaAlt"></div>
    <div class="hata" id="hata"></div>
    <div class="yazibar" id="yazibar"><input id="yazi" placeholder="Yazarak sor…" enterkeyhint="send"><button id="gonder">➤</button></div>
    <div class="bar">
      <button class="btn" id="kamera" title="Kamera">📷</button>
      <button class="btn" id="cevir" title="Kamerayı çevir">🔄</button>
      <button class="btn ana" id="basla" title="Başlat / Bitir">🎙️</button>
      <button class="btn" id="klavye" title="Yaz">⌨️</button>
      <button class="btn" id="ekran" title="Ekran paylaş">🖥️</button>
      <button class="btn" id="sessiz" title="Mikrofonu kapat">🔇</button>
    </div>
  </footer>
  <div id="cekmece">
    <h4>⚙️ Canlı ayarları</h4>
    <div class="secim">
      <label>Kullanım modu<select id="kmod">
        <option value="kisisel">👤 Kişisel asistan</option><option value="genel">🌐 Genel / misafir</option>
        <option value="genc">🎓 Genç (13-17)</option><option value="yetiskin">💼 Yetişkin</option><option value="cocuk">🧸 Çocuk</option></select></label>
      <label>Konuşma modu<select id="mod">
        <option value="asistan">🤖 Asistan</option><option value="masal">📖 Canlı masalcı</option>
        <option value="ceviri">🌐 Canlı tercüman</option><option value="dil">🗣️ Dil pratiği</option><option value="analiz">🔬 Kamera analizi</option></select></label>
      <label>Dil<select id="dil">
        <option value="tr">🇹🇷 Türkçe</option><option value="en">🇬🇧 English</option><option value="bn">🇧🇩 বাংলা</option>
        <option value="ar">🇸🇦 العربية</option><option value="ru">🇷🇺 Русский</option><option value="de">🇩🇪 Deutsch</option>
        <option value="fr">🇫🇷 Français</option><option value="es">🇪🇸 Español</option><option value="az">🇦🇿 Azərbaycan</option>
        <option value="ur">🇵🇰 اردو</option><option value="hi">🇮🇳 हिन्दी</option><option value="zh">🇨🇳 中文</option>
        <option value="ja">🇯🇵 日本語</option><option value="fa">🇮🇷 فارسی</option></select></label>
      <label>Ses<select id="ses">
        <option value="Leda">🧚 Leda — genç, sıcak</option><option value="Sulafat">👩 Sulafat — şefkatli</option>
        <option value="Aoede">🌸 Aoede — ferah</option><option value="Kore">💼 Kore — net</option>
        <option value="Achernar">🌙 Achernar — yumuşak</option><option value="Puck">😄 Puck — neşeli</option>
        <option value="Algieba">👴 Algieba — olgun</option><option value="Charon">🎓 Charon — öğretmen</option>
        <option value="Fenrir">⚡ Fenrir — enerjik</option></select></label>
      <label>Çocuk yaşı<select id="yas"><option value="3-6">🐣 3-6</option><option value="7-9" selected>🦊 7-9</option><option value="10-12">🚀 10-12</option></select></label>
    </div>
    <div id="notlar"></div>
  </div>
</div>
<script>
(() => {
"use strict";
const hash = new URLSearchParams(location.hash.slice(1));
const CFG = Object.assign({}, window.AREX_CANLI || {});
["t","k","mod","dil","ses","yas","profil","ad","kmod","acc","acc2","goz","tani","testMetin"].forEach(a => { if (hash.get(a)) CFG[a] = hash.get(a); });
let tokenAlFn = window.AREX_TOKEN_AL || null;
const TUM_MODELLER = CFG.modeller || ["gemini-3.8-live", "gemini-3.1-flash-live-preview", "gemini-2.5-flash-native-audio-latest"];
const oturumKota = {};  // yalnızca bu oturumda kotası dolan modeller (kalıcı atlama YOK; her yeni oturumda ana model yeniden denenir)
let MODELLER = TUM_MODELLER;
function modelSirasiHazirla() { MODELLER = TUM_MODELLER.slice(); }
const DIL_ADLARI = {tr:"Türkçe",en:"English",bn:"Bengalce (বাংলা)",ar:"Arapça (العربية)",ru:"Rusça (Русский)",de:"Almanca",fr:"Fransızca",es:"İspanyolca",az:"Azerbaycan Türkçesi",ur:"Urduca",hi:"Hintçe",zh:"Çince",ja:"Japonca",fa:"Farsça"};
const $ = id => document.getElementById(id);
const log = (...a) => { try { console.log("[AREX]", ...a); } catch (e) {} };
if (CFG.acc) document.documentElement.style.setProperty("--acc", CFG.acc);
if (CFG.acc2) document.documentElement.style.setProperty("--acc2", CFG.acc2);
if (CFG.mod === "cocuk") { CFG.kmod = "cocuk"; CFG.mod = "asistan"; }
for (const a of ["mod","dil","ses","yas","kmod"]) if (CFG[a] && $(a).querySelector(`option[value="${CFG[a]}"]`)) $(a).value = CFG[a];

// ---------- Göz koruma ----------
const gozKey = "arex_goz_koruma";
let goz = CFG.goz === "1" || CFG.goz === true; try { if (localStorage.getItem(gozKey) !== null) goz = localStorage.getItem(gozKey) === "1"; } catch (e) {}
const gozUygula = () => { document.body.classList.toggle("goz", goz); $("gozBtn").classList.toggle("on", goz); };
$("gozBtn").onclick = () => { goz = !goz; try { localStorage.setItem(gozKey, goz ? "1" : "0"); } catch (e) {} gozUygula(); bildir({ tur: "arex_goz", acik: goz }); };
gozUygula();

// ---------- Notlar (yerel + uygulamaya köprü) ----------
const notKey = "arex_canli_notlar";
const notlariOku = () => { try { return JSON.parse(localStorage.getItem(notKey) || "[]"); } catch (e) { return []; } };
function bildir(v) { const m = JSON.stringify(v); if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(m); else if (window.parent !== window) window.parent.postMessage(m, "*"); }
function notKaydet(metin) {
  const l = notlariOku(); const kayit = { metin, tarih: new Date().toLocaleString("tr-TR") }; l.push(kayit);
  try { localStorage.setItem(notKey, JSON.stringify(l.slice(-200))); } catch (e) {}
  bildir({ tur: "arex_not", metin }); notlariGoster();
  // Streamlit'te açıldıysa: notu Python tarafındaki Notlarım'a da kaydet (oturuma özel jetonlu köprü)
  if (!window.ReactNativeWebView && CFG.notKopruJeton) {
    let host = "127.0.0.1"; try { host = window.parent.location.hostname || host; } catch (e) {}
    fetch(`http://${host}:${CFG.notKopruPort}/not`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ jeton: CFG.notKopruJeton, metin }) })
      .then(r => log("not köprüsü", r.status)).catch(e => log("not köprüsü hatası", e.message));
  }
  return l.length;
}
function notlariGoster() {
  const l = [...(CFG.notlar || []).map(m => ({ metin: m })), ...notlariOku()];
  $("notlar").innerHTML = l.length ? "<b>📝 Notlarım</b><br>" + l.slice(-12).reverse().map(n => "• " + String(n.metin).replace(/</g, "&lt;")).join("<br>") : "📝 Canlıda \"bunu not al\" dersen buraya kaydedilir.";
}
notlariGoster();

// ---------- Karakterler (ses + üslup) ----------
const PERSONALAR = {
  asistan: { ad: "🤖 Asistan", ses: null, metin: "" },
  abi: { ad: "👨 Abi", ses: "Orus", metin: "KARAKTER: Kullanıcının sıcak, güven veren, akıl veren ABİSİ gibi konuş: 'kardeşim', 'aslanım' gibi samimi hitaplar, tecrübe paylaşan, koruyucu ama yargılamayan bir abi." },
  abla: { ad: "👩 Abla", ses: "Despina", metin: "KARAKTER: Kullanıcının şefkatli, neşeli ve akıllı ABLASI gibi konuş: 'canım kardeşim', 'tatlım' gibi sıcak hitaplar; dinleyen, cesaretlendiren, pratik öneriler veren bir abla." },
  anne: { ad: "👵 Anne", ses: "Sulafat", metin: "KARAKTER: Şefkatli, sabırlı bir ANNE sıcaklığıyla konuş: 'yavrum', 'kuzum' gibi hitaplar; dualarla, moral vererek, sağlığını ve dinlenmesini de düşünerek." },
  baba: { ad: "👨‍👧 Baba", ses: "Alnilam", metin: "KARAKTER: Kullanıcının sevgi dolu, güven veren, sakin ve sağlam BABASI gibi konuş: 'evladım', 'kızım/oğlum', 'canım' gibi hitaplar (cinsiyeti bilmiyorsan 'evladım'); önce dinle, sonra kısa, net ve hayat tecrübesiyle akıl ver; gerektiğinde nazikçe sınır koy, cesaretlendir, 'yanındayım' hissi ver. Nasihati uzatmadan, sıcak ama ağırbaşlı bir tonla." },
  dede: { ad: "👴 Dede", ses: "Rasalgethi", metin: "KARAKTER: Bilge, tatlı dilli bir DEDE gibi konuş: 'evladım', 'torunum' hitapları; atasözleri, kısa hatıralar ve hikmetli sözlerle, yavaş ve sakin." },
  hoca: { ad: "🧑‍🏫 Hoca", ses: "Charon", metin: "KARAKTER: İyi bir ÖĞRETMEN gibi konuş: net, sabırlı, adım adım anlatan, soru sorarak düşündüren, başarıyı takdir eden." },
  arkadas: { ad: "🤝 Arkadaş", ses: "Puck", metin: "KARAKTER: Yakın bir ARKADAŞ gibi konuş: rahat, esprili, samimi, 'kanka' tadında ama saygılı." },
  icten: { ad: "💞 İçten", ses: "Vindemiatrix", metin: "KARAKTER — İÇTEN SOHBET: Acele etme, gerçekten dinle ve duyguyu yansıt; sıcak, yumuşak, yargısız ve derin konuş; kısa ve samimi cümlelerle, uygun yerde nazik bir soruyla sohbeti derinleştir; kişinin değerli olduğunu hissettir. Ciddi bir sıkıntı sezersen güvendiği biriyle ya da bir uzmanla konuşmasını nazikçe öner." },
  mumin: { ad: "🕌 Mümin", ses: "Iapetus", metin: "KARAKTER — MÜMİN MODU: Edepli, nazik bir Müslüman gibi konuş: yalnızca kullanıcı selam verirse 'Aleyküm selam' diye al; yerinde 'Elhamdülillah', 'Maşallah', 'İnşallah', 'Allah razı olsun', 'Barekallah' de; hocalara ve büyüklere 'hocam', 'efendim' diye saygıyla hitap et. Ayet veya hadis aktarırken ASLA uydurma: ayet için ayet_getir aracını, hadis için hadis_getir aracını kullan ve kaynağını (sure:ayet; hadisin kaynağı ve derecesi) söyle; emin değilsen 'bunu hocalarımıza danışmak en doğrusu' de. Fetva verme; fıkhi konularda Diyanet ve hocalara yönlendir. Diğer inançlara ve insanlara saygılı ol." },
};

  { name: "uygulama_ac", description: "Kullanıcının telefonunda bir uygulamayı açar veya içinde arama yapar (ör. 'YouTube aç', 'YouTube'da Yasin tilaveti ara', 'haritada en yakın camiyi göster', 'WhatsApp aç').",
    parameters: { type: "OBJECT", properties: { hedef: { type: "STRING", enum: ["youtube", "whatsapp", "instagram", "telegram", "spotify", "gmail", "harita", "yol", "telefon", "sms", "google", "ayarlar"] }, sorgu: { type: "STRING", description: "Arama/konum/numara (isteğe bağlı)" } }, required: ["hedef"] } },
  { name: "hadis_getir", description: "Kaynağı ve derecesi belli sahih bir hadis getirir (HadeethEnc). İsteğe bağlı konu kelimesi alır.", parameters: { type: "OBJECT", properties: { konu: { type: "STRING" } } } },
];

async function baglan() {
  const adres = await adresAl();
  if (!adres) { hata("Gemini anahtarı bulunamadı — Ayarlar'dan ekle."); bitir(); return; }
  kurulumTamam = false; durumYaz("Bağlanıyor…", "");
  ws = new WebSocket(adres);
  const model = MODELLER[modelSira % MODELLER.length];
  ws.onopen = () => ws.send(JSON.stringify({ setup: {
    model: "models/" + model,
    generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: aktifSes() } } } },
    systemInstruction: { parts: [{ text: sistemTalimati() }] },
    tools: [ARACLAR[0], { functionDeclarations: [...($("kmod").value === "kisisel" ? ARACLAR[1].functionDeclarations : []), ...ORTAK_ARACLAR] }],
    realtimeInputConfig: { automaticActivityDetection: { startOfSpeechSensitivity: "START_SENSITIVITY_HIGH", endOfSpeechSensitivity: "END_SENSITIVITY_LOW", prefixPaddingMs: 40, silenceDurationMs: 650 } },
    inputAudioTranscription: {}, outputAudioTranscription: {},
    contextWindowCompression: { slidingWindow: {} },
    sessionResumption: devamHandle ? { handle: devamHandle } : {},
  } }));
  ws.onmessage = async e => {
    const s = typeof e.data === "string" ? e.data : await e.data.text();
    let m; try { m = JSON.parse(s); } catch (x) { return; }
    if (m.setupComplete) {
      kurulumTamam = true; hata(""); yenidenDeneme = 0; log("kurulum tamam", model, "tampondaki paket:", sesTampon.length);
      for (const pk of sesTampon.splice(0)) ws.send(JSON.stringify({ realtimeInput: { audio: { data: pk, mimeType: "audio/pcm;rate=16000" } } }));
      try { localStorage.setItem("arex_canli_model", model); } catch (x) {}
      // Ses/üslup değişimi ya da kopma sonrası: son söylenen cevapsız kaldıysa yeni oturumda hemen cevapla
      const sonD = dokum[dokum.length - 1];
      if (!devamHandle && sonD && sonD.kim === "Kullanıcı" && sonD.metin.trim().length > 3) {
        setTimeout(() => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ realtimeInput: { text: sonD.metin.trim() } })); }, 250);
      }
      if (CFG.testMetin) setTimeout(() => ws.send(JSON.stringify({ realtimeInput: { text: CFG.testMetin } })), 500);
      return;
    }
    if (m.sessionResumptionUpdate && m.sessionResumptionUpdate.resumable && m.sessionResumptionUpdate.newHandle) devamHandle = m.sessionResumptionUpdate.newHandle;
    if (m.goAway) { try { ws.close(); } catch (x) {} return; }
    if (m.toolCall) {
      const yanitlar = await Promise.all((m.toolCall.functionCalls || []).map(async f => {
        const a = f.args || {};
        let sonuc;
        try {
          if (f.name === "not_kaydet") sonuc = { durum: "kaydedildi", no: notKaydet(String(a.metin || "")) };
          else if (f.name === "notlari_getir") sonuc = { notlar: [...(CFG.notlar || []), ...notlariOku().map(n => n.metin)].slice(-30) };
          else if (f.name === "mod_ayarla") {
            if (typeof a.mizah === "boolean") mizah = a.mizah;
            if (a.karakter && PERSONALAR[a.karakter]) persona = a.karakter;
            ayarDegisti(false);
            sonuc = { durum: "tamam", mizah, karakter: persona, not: "Yeni ses ve üslup bu cümleden sonra devreye girecek." };
          }
          else if (f.name === "uygulama_ac") { bildir({ tur: "arex_ac", hedef: a.hedef, sorgu: a.sorgu || "" }); sonuc = { durum: (window.ReactNativeWebView ? "açılıyor" : "bu cihazda uygulama açma yalnızca telefon uygulamasında çalışır"), hedef: a.hedef }; }
          else if (f.name === "ayet_getir") sonuc = await ayetGetir(a.sure, a.ayet);
          else if (f.name === "esma_getir") sonuc = await esmaGetir(a.no);
          else if (f.name === "hadis_getir") sonuc = await hadisGetir(a.konu);
          else sonuc = { hata: "bilinmeyen araç" };
        } catch (e) { sonuc = { hata: "Kaynağa şu an ulaşılamadı: " + e.message }; }
        log("araç", f.name, JSON.stringify(sonuc).slice(0, 120));
        return { id: f.id, name: f.name, response: sonuc };
      }));
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ toolResponse: { functionResponses: yanitlar } }));
      return;
    }
    const sc = m.serverContent; if (!sc) return;
    if (sc.interrupted) { log("söz kesildi"); caliKes(); sonCikti = null; dusunuyor = false; }
    if (sc.inputTranscription && sc.inputTranscription.text) { log("duyulan:", sc.inputTranscription.text); dokumEkle("Kullanıcı", sc.inputTranscription.text); satirEkle("ben", sc.inputTranscription.text, true); dusunuyor = true; }
    if (sc.outputTranscription && sc.outputTranscription.text) { satirEkle("o", sc.outputTranscription.text, true); sonGirdi = null; }
    for (const p of ((sc.modelTurn || {}).parts || [])) if (p.inlineData && p.inlineData.data) { dusunuyor = false; sesParca++; pcmCal(p.inlineData.data); }
    if (sc.outputTranscription && sc.outputTranscription.text) { log("söylenen:", sc.outputTranscription.text); dokumEkle("AREX", sc.outputTranscription.text); }
    if (sc.turnComplete) log("tur bitti; ses parçası:", sesParca, "çalma durumu:", calCtx && calCtx.state);
    if (sc.turnComplete) {
      sonCikti = null; sonGirdi = null; dusunuyor = false;
      if (bekleyenYenileme) { bekleyenYenileme = false; setTimeout(() => { if (aktif && ws) { devamHandle = null; try { ws.close(); } catch (e) {} } }, Math.max(300, (calZaman - (calCtx ? calCtx.currentTime : 0)) * 1000 + 300)); }
    }
  };
  ws.onclose = ev => {
    log("bağlantı kapandı", model, ev.code, (ev.reason || "").slice(0, 120));
    const kuruldu = kurulumTamam; kurulumTamam = false;
    if (!aktif || kapatiliyor) return;
    const kota = /quota|exceeded/i.test(ev.reason || "");
    const modelYok = /not found|not supported|unavailable for/i.test(ev.reason || "");
    if (kota || modelYok || (!kuruldu && ev.code === 1008)) {
      // Yalnızca kota/model yoksa yedeğe geç; konuşma dökümü yeni modele aktarılır (sohbet kopmaz)
      oturumKota[model] = true; devamHandle = null;
      const sonraki = MODELLER.findIndex((m, i) => i > modelSira && !oturumKota[m]);
      if (sonraki >= 0) { modelSira = sonraki; durumYaz("Yedek modele geçiliyor…", "Konuşma kaldığı yerden sürecek"); setTimeout(baglan, 250); return; }
      hata(kota ? "Canlı sohbetin ücretsiz kotası şu an dolu; biraz sonra tekrar dene." : "Canlı model şu an kullanılamıyor.");
      bitir(); return;
    }
    // Ağ kopması / sunucu yenilemesi → AYNI modele kademeli yeniden bağlan (oturum devamı tutamacıyla)
    yenidenBaglan();
  };
  ws.onerror = () => {};
}

let canliBaslangic = 0, sureZamanlayici = null;
function rozetGuncelle() {
  const r = $("rozet");
  r.classList.toggle("on", aktif && kurulumTamam); r.classList.toggle("bag", aktif && !kurulumTamam);
  $("rozetYazi").textContent = aktif ? (kurulumTamam ? "CANLI" : "BAĞLANIYOR") : "HAZIR";
  if (aktif && canliBaslangic) { const sn = Math.floor((Date.now() - canliBaslangic) / 1000); $("sure").textContent = String(Math.floor(sn / 60)).padStart(2, "0") + ":" + String(sn % 60).padStart(2, "0"); }
  else $("sure").textContent = "";
}
function yenidenBaglan() {
  if (!aktif || kapatiliyor) return;
  clearTimeout(baglantiZamanlayici);
  if (!navigator.onLine) { durumYaz("Bağlantı yok", "İnternet gelince otomatik devam edecek"); return; }
  const bekle = Math.min(8000, 400 * Math.pow(2, yenidenDeneme++));
  durumYaz("Yeniden bağlanıyor…", "Konuşma kaldığı yerden sürecek");
  if (yenidenDeneme > 12) { hata("Bağlantı kurulamıyor; internetini kontrol et."); bitir(); return; }
  baglantiZamanlayici = setTimeout(baglan, bekle);
}
window.addEventListener("online", () => { if (aktif && (!ws || ws.readyState > 1)) { yenidenDeneme = 0; clearTimeout(baglantiZamanlayici); baglan(); } });
window.addEventListener("offline", () => { if (aktif) durumYaz("Bağlantı koptu", "İnternet gelince otomatik devam edecek"); });

async function basla() {
  hata(""); calHazirla(); if (calCtx.state === "suspended") await calCtx.resume();
  try { await mikrofonAc(); } catch (e) { hata("Mikrofona izin verilmedi (tarayıcı/uygulama ayarlarından izin ver; telefonda https gerekir)."); return; }
  aktif = true; kapatiliyor = false; modelSira = 0; devamHandle = null; sesTampon = []; yenidenDeneme = 0; modelSirasiHazirla();
  canliBaslangic = Date.now(); clearInterval(sureZamanlayici); sureZamanlayici = setInterval(rozetGuncelle, 500);
  $("basla").classList.add("aktif"); $("basla").textContent = "✕";
  await baglan();
}
function bitir() {
  aktif = false; kapatiliyor = true; kurulumTamam = false; dusunuyor = false; clearTimeout(baglantiZamanlayici);
  clearInterval(sureZamanlayici); canliBaslangic = 0; bekleyenYenileme = false; setTimeout(rozetGuncelle, 0);
  try { ws && ws.close(); } catch (e) {} ws = null;
  mikrofonKapat(); kameraKapat(); caliKes();
  $("basla").classList.remove("aktif"); $("basla").textContent = "🎙️"; durumYaz("Konuşmak için dokun", "Sözünü kesebilir, kamerayı açıp gösterebilirsin");
}
function yaziGonder() {
  const t = $("yazi").value.trim(); if (!t) return;
  if (!aktif || !ws || ws.readyState !== 1 || !kurulumTamam) { hata("Önce 🎙️ ile canlı oturumu başlat."); return; }
  satirEkle("ben", t, false); sonGirdi = null; $("yazi").value = ""; dusunuyor = true;
  ws.send(JSON.stringify({ realtimeInput: { text: t } }));
}

$("basla").onclick = () => aktif ? bitir() : basla();
// "Konuşmak için dokun": küreye dokunmak da başlatır/durdurur
$("kure").style.cursor = "pointer";
$("kure").onclick = () => $("basla").click();
$("kamera").onclick = () => (kamStream && !ekranMi) ? kameraKapat() : kameraAc(false);
$("ekran").onclick = () => (kamStream && ekranMi) ? kameraKapat() : kameraAc(true);
$("cevir").onclick = () => { kamYuz = kamYuz === "user" ? "environment" : "user"; if (kamStream && !ekranMi) kameraAc(false); };
$("sessiz").onclick = () => { sessiz = !sessiz; $("sessiz").classList.toggle("on", sessiz); $("sessiz").textContent = sessiz ? "🎤" : "🔇"; };
$("klavye").onclick = () => { $("yazibar").classList.toggle("on"); $("klavye").classList.toggle("on"); if ($("yazibar").classList.contains("on")) $("yazi").focus(); };
$("ayarBtn").onclick = () => $("cekmece").classList.toggle("on");
$("sahne").addEventListener("click", () => $("cekmece").classList.remove("on"));
$("gonder").onclick = yaziGonder;
$("yazi").addEventListener("keydown", e => { if (e.key === "Enter") yaziGonder(); });
$("ses").addEventListener("change", () => { if (persona !== "asistan" || mizah) { persona = "asistan"; mizah = false; karakterleriCiz(); } });
for (const a of ["mod","dil","ses","yas","kmod"]) $(a).onchange = () => { if (aktif && ws) { devamHandle = null; caliKes(); try { ws.close(); } catch (e) {} } };
if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia || /Android|iPhone|iPad/i.test(navigator.userAgent)) $("ekran").style.display = "none";
karakterleriCiz(); rozetGuncelle();
if (CFG.otomatik) setTimeout(basla, 300);
window.AREX_CANLI_DIS = { basla, bitir, ayarla: (k, v) => { CFG[k] = v; } };
})();
</script>
